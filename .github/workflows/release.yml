name: Release

on:
  workflow_dispatch:
    inputs:
      versionBump:
        description: Version bump type
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: npm run lint

      - run: xvfb-run -a npm test

      - name: Bump version and tag
        id: version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm version ${{ inputs.versionBump }} -m "Release v%s"
          echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Set package file name
        id: package_name
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SHA=$(git rev-parse --short HEAD)
          echo "file=simple-task-tree-$VERSION-$SHA.vsix" >> "$GITHUB_OUTPUT"

      - run: npx vsce package --out ${{ steps.package_name.outputs.file }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package_name.outputs.file }}
          path: ${{ steps.package_name.outputs.file }}
          retention-days: 7

      - run: git push origin HEAD:main --follow-tags

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            ${{ steps.package_name.outputs.file }} \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes

      - name: Publish to Visual Studio Marketplace
        if: ${{ env.VSCE_PAT != '' }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --packagePath ${{ steps.package_name.outputs.file }}
