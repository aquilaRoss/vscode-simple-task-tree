name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: npm run lint

      - run: xvfb-run -a npm test

      - run: npx vsce package --out simple-task-tree.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: simple-task-tree-vsix
          path: simple-task-tree.vsix
          retention-days: 7
