name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: npm run lint

      - run: xvfb-run -a npm test

      - name: Set package file name
        id: package_name
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SHA=$(git rev-parse --short HEAD)
          echo "file=simple-task-tree-$VERSION-$SHA.vsix" >> "$GITHUB_OUTPUT"

      - run: npx vsce package --out ${{ steps.package_name.outputs.file }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package_name.outputs.file }}
          path: ${{ steps.package_name.outputs.file }}
          retention-days: 7
